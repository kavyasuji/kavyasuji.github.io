<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kavya Suji</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #22c55e;
        --accent-2: #38bdf8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(90vw, 760px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        padding: 40px 32px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }

      .eyebrow {
        color: var(--accent-2);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.8rem;
        font-weight: bold;
      }

      h1 {
        margin: 12px 0 16px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.1;
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      a.button {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 999px;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        font-weight: 600;
        transition: transform 0.2s ease;
      }

      a.button:hover {
        transform: translateY(-2px);
      }

      a.button.secondary {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.5);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="eyebrow">Hello, world</div>
      <h1>I’m Kavya Suji</h1>
      <p>
        I build things, learn fast, and enjoy turning ideas into simple digital experiences.
        This is my GitHub Pages site, hosted from my Pages repository.
      </p>

      <div class="links">
        <a class="button" href="https://github.com/kavyasuji" target="_blank" rel="noreferrer">GitHub</a>
        <a class="button secondary" href="mailto:your-email@example.com">Contact</a>
      </div>
    </main>
  </body>
</html>
